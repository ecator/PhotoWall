name: Upload Python Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing via OIDC token
      id-token: write

    steps:
      # 1. Check out code (fetch-depth: 0 needed for hatch-vcs tag detection)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install and configure uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # 3. Rewrite relative links in README for PyPI
      - name: Rewrite relative links in README
        run: |
          sed -i -E 's|\]\((\./)?([^:#)][^:)]*)\)|](${{ github.event.repository.html_url }}/blob/main/\2)|g' README.md
          # Mark README.md as unchanged so hatch-vcs sees a clean worktree instead of appending a dirty dev suffix
          git update-index --assume-unchanged README.md

      # 4. Build release distributions (dist/)
      - name: Build release distributions
        run: uv build

      # 5. Publish directly to PyPI
      # uv detects GitHub's id-token and handles OIDC exchange with PyPI without API tokens
      - name: Publish to PyPI
        run: uv publish
