      }
    };

    // Utilities: R6 Requirements
    function formatBytes(bytes) {
      if (bytes === undefined || bytes === null || isNaN(bytes) || bytes <= 0 || !Number.isFinite(Number(bytes))) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      if (i <= 0) return `${bytes} B`;
      const val = (bytes / Math.pow(1024, i)).toFixed(2);
      return `${val} ${units[i] || 'GB'}`;
    }

    function formatDuration(seconds) {
      if (!seconds || isNaN(seconds) || seconds <= 0 || !Number.isFinite(Number(seconds))) return '00:00';
      const sec = Math.round(seconds);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (h > 0) {
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      let date;
      if (typeof timestamp === 'number' || (typeof timestamp === 'string' && !isNaN(Number(timestamp)) && timestamp.trim() !== '')) {
        date = new Date(Number(timestamp) * 1000);
      } else {
        date = new Date(timestamp);
      }
      if (isNaN(date.getTime())) return String(timestamp);
      const pad = (n) => String(n).padStart(2, '0');
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      const hours = pad(date.getHours());
      const minutes = pad(date.getMinutes());
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function naturalCompare(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      let iconSvg = ICONS.info;
      if (type === 'success') iconSvg = ICONS.check;
      if (type === 'warning' || type === 'error') iconSvg = ICONS.info;

      toast.innerHTML = `<span class="toast-icon">${iconSvg}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('toast-hiding');
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 2600);
    }

    function copyToClipboard(text, btnElement) {
      const fallbackCopy = () => {
        try {
          const input = document.createElement('input');
          input.value = text;
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showToast(`已复制: ${text}`, 'success');
        } catch (err) {
          showToast('复制失败，请手动选取代码', 'warning');
        }
      };

      const updateBtn = () => {
        if (btnElement) {
          const origHtml = btnElement.innerHTML;
          btnElement.innerHTML = `<span class="svg-icon svg-icon-sm">${ICONS.check}</span> 已复制`;
          setTimeout(() => {
            btnElement.innerHTML = origHtml;
          }, 1500);
        }
      };

      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`已复制: ${text}`, 'success');
          updateBtn();
        }).catch(() => {
          fallbackCopy();
          updateBtn();
        });
      } else {
        fallbackCopy();
        updateBtn();
      }
    }

    // Local Favorites Persistence & Auto Cleanup
    function initFavorites() {
      const raw = localStorage.getItem('PHOTOWALL_FAVORITES');
      let stored = [];
      if (raw) {
        try {
          stored = JSON.parse(raw);
          if (!Array.isArray(stored)) stored = [];
        } catch (e) {
          stored = [];
        }
      }

      // Early exit if stored is empty - avoid allocating 193k set on startup
      if (stored.length === 0) {
        STATE.favoritesSet = new Set();
        updateFavoritesBadge();
        return;
      }

      // Build valid set and deduplicate
      const validSrcSet = new Set((STATE.allItems || []).map(it => it.src));
      const uniqueStored = Array.from(new Set(stored.filter(s => typeof s === 'string')));
      const cleaned = uniqueStored.filter(src => validSrcSet.has(src));

      if (cleaned.length !== stored.length) {
        const removedCount = stored.length - cleaned.length;
        localStorage.setItem('PHOTOWALL_FAVORITES', JSON.stringify(cleaned));
        showToast(`已自动清理 ${removedCount} 个已失效的收藏项`, 'info');
      }

      STATE.favoritesSet = new Set(cleaned);
      updateFavoritesBadge();
    }

    function toggleFavorite(src) {
      if (STATE.favoritesSet.has(src)) {
        STATE.favoritesSet.delete(src);
        showToast('已取消收藏', 'info');
      } else {
        STATE.favoritesSet.add(src);
        showToast('已添加到收藏 ❤️', 'success');
      }

      // Persist
      localStorage.setItem('PHOTOWALL_FAVORITES', JSON.stringify(Array.from(STATE.favoritesSet)));
      updateFavoritesBadge();
      updateVisibleHeartButtons(src);

      // If in favorites view and an item was removed, re-run pipeline
      if (STATE.isFavoritesView) {
        runFilterPipeline();

        // Guard active Lightbox index
        if (STATE.lightbox.isOpen) {
          if (STATE.filteredItems.length === 0) {
            closeLightbox();
            showToast('收藏夹已空', 'info');
          } else {
            if (STATE.lightbox.currentIndex >= STATE.filteredItems.length) {
              STATE.lightbox.currentIndex = STATE.filteredItems.length - 1;
            }
            renderLightboxCurrentItem();
          }
        }

        // Guard active Slideshow index
        if (STATE.slideshow.isOpen) {
          if (STATE.filteredItems.length === 0) {
            stopSlideshow();
            showToast('收藏夹已空', 'info');
          } else {
            if (STATE.slideshow.currentIndex >= STATE.filteredItems.length) {
              STATE.slideshow.currentIndex = STATE.filteredItems.length - 1;
            }
            renderSlideshowItem();
          }
        }
      }
    }

    function updateFavoritesBadge() {
      const badge = document.getElementById('nav-fav-badge');
      if (badge) {
        badge.textContent = STATE.favoritesSet.size;
      }
    }

    function updateVisibleHeartButtons(targetSrc) {
      // Update in media grid
      const safeSelector = (window.CSS && CSS.escape)
        ? `.card-fav-btn[data-src="${CSS.escape(targetSrc)}"]`
        : `.card-fav-btn[data-src="${targetSrc.replace(/["\\]/g, '\\$&')}"]`;
      document.querySelectorAll(safeSelector).forEach(btn => {
        const isFav = STATE.favoritesSet.has(targetSrc);
        btn.classList.toggle('active', isFav);
        btn.innerHTML = isFav ? ICONS.heartFilled : ICONS.heartOutline;
      });

      // Update in Lightbox if open
      if (STATE.lightbox.isOpen) {
        const item = STATE.filteredItems[STATE.lightbox.currentIndex];
        if (item && item.src === targetSrc) {
          const lbBtn = document.getElementById('lightbox-fav-btn');
          if (lbBtn) {
            const isFav = STATE.favoritesSet.has(targetSrc);
            lbBtn.classList.toggle('active', isFav);
            lbBtn.classList.toggle('lightbox-btn-danger', isFav);
            lbBtn.innerHTML = (isFav ? ICONS.heartFilled : ICONS.heartOutline) + ` <span>${isFav ? '已收藏' : '收藏'}</span>`;
          }
        }
      }

      // Update in Slideshow if open
      if (STATE.slideshow.isOpen) {
        const item = STATE.filteredItems[STATE.slideshow.currentIndex];
        if (item && item.src === targetSrc) {
          const hudFav = document.getElementById('hud-fav-btn');
          if (hudFav) {
            const isFav = STATE.favoritesSet.has(targetSrc);
            hudFav.classList.toggle('active', isFav);
            hudFav.classList.toggle('hud-btn-danger', isFav);
            hudFav.innerHTML = isFav ? ICONS.heartFilled : ICONS.heartOutline;
          }
        }
      }
    }

    // Theme handling
    function applyTheme(theme) {
      STATE.theme = theme;
      localStorage.setItem('PHOTOWALL_THEME', theme);
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      const themeBtn = document.getElementById('theme-toggle-btn');
      if (themeBtn) {
        themeBtn.innerHTML = theme === 'light' ? ICONS.moon : ICONS.sun;
        themeBtn.title = theme === 'light' ? '切换为深色模式' : '切换为浅色模式';
      }
    }

    function toggleTheme() {
      applyTheme(STATE.theme === 'light' ? 'dark' : 'light');
    }


    // ========================================================
    // Filtering Pipeline & Navigation Hierarchy
    // ========================================================

    let lastFolderScopeKey = null;

    function runFilterPipeline() {
      const currentScopeKey = `${STATE.isFavoritesView}:${STATE.currentFolder}:${STATE.includeSubfolders}:${STATE.favoritesSet.size}`;
      const scopeChanged = currentScopeKey !== lastFolderScopeKey;

      // Step 1: Scope filtering & tag frequency caching
      if (scopeChanged || !STATE.folderScopedItems) {
        lastFolderScopeKey = currentScopeKey;

        if (STATE.isFavoritesView) {
          STATE.folderScopedItems = STATE.allItems.filter(it => STATE.favoritesSet.has(it.src));
        } else {
          if (STATE.currentFolder === '') {
            // Root folder
            STATE.folderScopedItems = STATE.includeSubfolders
              ? STATE.allItems
              : STATE.allItems.filter(it => it.folder === '');
          } else {
            const prefix = STATE.currentFolder + '/';
            STATE.folderScopedItems = STATE.includeSubfolders
              ? STATE.allItems.filter(it => it.folder === STATE.currentFolder || (it.folder && it.folder.startsWith(prefix)))
              : STATE.allItems.filter(it => it.folder === STATE.currentFolder);
          }
        }

        // Step 2: Dynamic recalculation of tag frequencies in current folder scope (single-pass)
        const tagCounts = {};
        const scoped = STATE.folderScopedItems;
        for (let i = 0; i < scoped.length; i++) {
          const it = scoped[i];
          if (it.tags) {
            for (let j = 0; j < it.tags.length; j++) {
              const t = it.tags[j];
              tagCounts[t] = (tagCounts[t] || 0) + 1;
            }
          }
        }
        STATE._cachedTagCounts = tagCounts;

        // Clean selectedTags that no longer exist in current scope
        for (const t of STATE.selectedTags) {
          if (!tagCounts[t]) {
            STATE.selectedTags.delete(t);
          }
        }

        STATE._cachedSortedTags = Object.entries(tagCounts).sort((a, b) => {
          if (b[1] !== a[1]) return b[1] - a[1];
          return naturalCompare(String(a[0]), String(b[0]));
        });

        // Render navigation components when scope changes
        renderBreadcrumbs();
        renderSubfolders();
        renderDirectoryTree();
      }

      // Dynamic tag capsules bar
      renderTagsBar(STATE.folderScopedItems);

      // Step 3: Media type filter (skip allocation if 'all')
      let results;
      if (STATE.mediaType === 'all') {
        results = STATE.folderScopedItems;
      } else {
        results = STATE.folderScopedItems.filter(it => {
          const isGif = it.ext === 'gif' || it.ext === '.gif' || (it.name && it.name.toLowerCase().endsWith('.gif'));
          if (STATE.mediaType === 'gif') return isGif;
          if (STATE.mediaType === 'video') return it.type === 'video';
          if (STATE.mediaType === 'image') return it.type === 'image' && !isGif;
          return true;
        });
      }

      // Step 4: Selected tag intersection (every)
      if (STATE.selectedTags.size > 0) {
        const activeTagsArr = Array.from(STATE.selectedTags);
        results = results.filter(it => {
          if (!it.tags || !Array.isArray(it.tags)) return false;
          return activeTagsArr.every(tag => it.tags.includes(tag));
        });
      }

      // Step 5: Keyword fuzzy search (optimized short-circuiting)
      if (STATE.searchKeyword.trim() !== '') {
        const q = STATE.searchKeyword.trim().toLowerCase();
        results = results.filter(it => {
          if (it.name && it.name.toLowerCase().includes(q)) return true;
          if (it.folder && it.folder.toLowerCase().includes(q)) return true;
          if (it.src && it.src.toLowerCase().includes(q)) return true;
          if (it.src && it.src.indexOf('%') !== -1) {
            try {
              if (decodeURIComponent(it.src).toLowerCase().includes(q)) return true;
            } catch (e) { }
          }
          if (it.tags) {
            for (const t of it.tags) {
              if (String(t || '').toLowerCase().includes(q)) return true;
            }
          }
          return false;
        });
      }

      // Step 6: Sorting (skip sort if default since subset maintains monotonic ID order)
      if (STATE.sortBy !== 'default') {
        results = results.slice();
        results.sort((a, b) => {
          switch (STATE.sortBy) {
            case 'time-desc':
              return (b.mtime || 0) - (a.mtime || 0);
            case 'time-asc':
              return (a.mtime || 0) - (b.mtime || 0);
            case 'size-desc':
              return (b.size || 0) - (a.size || 0);
            case 'size-asc':
              return (a.size || 0) - (b.size || 0);
            case 'name-asc':
              return naturalCompare(String(a.name || ''), String(b.name || ''));
            default:
              return (a.id || 0) - (b.id || 0);
          }
        });
      }

      STATE.filteredItems = results;

      // Update UI indicators
      const countEl = document.getElementById('results-count-text');
      if (countEl) {
        countEl.textContent = `共 ${results.length} 项`;
      }

      // Reset and batch render the grid
      resetAndRenderGrid();

      // Refresh back-to-top visibility
      updateBackToTopVisibility();
    }

    // Render dynamic tag capsules
    function renderTagsBar(scopedItems) {
      const container = document.getElementById('tags-bar-container');
      if (!container) return;

      const items = scopedItems || STATE.folderScopedItems || [];
      let sortedTags = STATE._cachedSortedTags;
      let tagCounts = STATE._cachedTagCounts;

      if (!sortedTags || (scopedItems && scopedItems !== STATE.folderScopedItems)) {
        tagCounts = {};
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          if (it.tags) {
            for (let j = 0; j < it.tags.length; j++) {
              const t = it.tags[j];
              tagCounts[t] = (tagCounts[t] || 0) + 1;
            }
          }
        }
        sortedTags = Object.entries(tagCounts).sort((a, b) => {
          if (b[1] !== a[1]) return b[1] - a[1];
          return naturalCompare(String(a[0]), String(b[0]));
        });
      }

      container.innerHTML = '';

      if (!sortedTags || sortedTags.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';

      const fragment = document.createDocumentFragment();

      // "All" capsule
      const allCapsule = document.createElement('button');
      allCapsule.className = `tag-capsule ${STATE.selectedTags.size === 0 ? 'active' : ''}`;
      allCapsule.innerHTML = `<span>全部标签</span> <span class="tag-badge">${items.length}</span>`;
      allCapsule.onclick = () => {
        STATE.selectedTags.clear();
        runFilterPipeline();
      };
      fragment.appendChild(allCapsule);

      // Render top tags, ensuring any currently selected tag is ALWAYS included
      const displayTags = sortedTags.slice(0, 60);
      const displayedTagNames = new Set(displayTags.map(([t]) => t));
      for (const selTag of STATE.selectedTags) {
        if (!displayedTagNames.has(selTag) && tagCounts && tagCounts[selTag] !== undefined) {
          displayTags.push([selTag, tagCounts[selTag]]);
        }
      }

      for (let i = 0; i < displayTags.length; i++) {
        const [tag, count] = displayTags[i];
        const isSelected = STATE.selectedTags.has(tag);
        const capsule = document.createElement('button');
        capsule.className = `tag-capsule ${isSelected ? 'active' : ''}`;
        capsule.innerHTML = `<span>${tag}</span> <span class="tag-badge">${count}</span>`;
        capsule.onclick = () => {
          if (STATE.selectedTags.has(tag)) {
            STATE.selectedTags.delete(tag);
          } else {
            STATE.selectedTags.add(tag);
          }
          runFilterPipeline();
        };
        fragment.appendChild(capsule);
      }

      container.appendChild(fragment);
    }

    // Render Breadcrumbs
    function renderBreadcrumbs() {
      const container = document.getElementById('breadcrumbs-bar');
      if (!container) return;
      container.innerHTML = '';

      if (STATE.isFavoritesView) {
        const favItem = document.createElement('span');
        favItem.className = 'breadcrumb-item active';
        favItem.innerHTML = `${ICONS.heartFilled} 我的收藏`;
        container.appendChild(favItem);
        return;
      }

      // Root item
      const rootItem = document.createElement('span');
      rootItem.className = `breadcrumb-item ${STATE.currentFolder === '' ? 'active' : ''}`;
      rootItem.innerHTML = `${ICONS.folder} 根目录`;
      rootItem.onclick = () => {
        if (STATE.currentFolder !== '') {
          selectFolder('');
        }
      };
      container.appendChild(rootItem);

      if (STATE.currentFolder !== '') {
        const parts = STATE.currentFolder.split('/');
        let currentPathAcc = '';
        parts.forEach((part, idx) => {
          currentPathAcc = currentPathAcc ? `${currentPathAcc}/${part}` : part;
          const isLast = idx === parts.length - 1;

          const sep = document.createElement('span');
          sep.className = 'breadcrumb-separator';
          sep.innerHTML = ICONS.chevronRight;
          container.appendChild(sep);

          const partItem = document.createElement('span');
          partItem.className = `breadcrumb-item ${isLast ? 'active' : ''}`;
          partItem.textContent = part;
          const targetPath = currentPathAcc;
          if (!isLast) {
            partItem.onclick = () => selectFolder(targetPath);
          }
          container.appendChild(partItem);
        });
      }
    }

    // Render Subfolders Horizontal Cards
    function renderSubfolders() {
      const section = document.getElementById('subfolders-section');
      const list = document.getElementById('subfolders-list');
      if (!section || !list) return;

      if (STATE.isFavoritesView) {
        section.style.display = 'none';
        return;
      }

      // Find direct subfolders: f.parent === STATE.currentFolder (or parent === null/'' for root)
      const currentF = STATE.currentFolder;
      const subfolders = STATE.allFolders.filter(f => {
        if (currentF === '') {
          return f.path !== '' && (f.parent === '' || f.parent === null);
        }
        return f.parent === currentF;
      });

      if (subfolders.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'flex';
      list.innerHTML = '';
      const fragment = document.createDocumentFragment();

      subfolders.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'subfolder-card';
        card.onclick = () => selectFolder(folder.path);

        const countDisplay = STATE.includeSubfolders ? folder.totalCount : folder.directCount;

        let coverHtml = '';
        if (folder.cover) {
          coverHtml = `<img src="${folder.cover}" alt="${folder.name}" loading="lazy" onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex';" /><div class="subfolder-cover-fallback" style="display:none;">${ICONS.folder}</div>`;
        } else {
          coverHtml = `<div class="subfolder-cover-fallback">${ICONS.folder}</div>`;
        }

        card.innerHTML = `
      <div class="subfolder-cover">${coverHtml}</div>
      <div class="subfolder-info">
        <div class="subfolder-name" title="${folder.name}">${folder.name}</div>
        <div class="subfolder-count">${countDisplay} 项媒体</div>
      </div>
    `;
        fragment.appendChild(card);
      });
      list.appendChild(fragment);
    }

    // Render Sidebar Directory Tree
    function renderDirectoryTree() {
      const container = document.getElementById('tree-container');
      if (!container) return;
      container.innerHTML = '';
      const fragment = document.createDocumentFragment();

      // Sort folders
      const folders = [...STATE.allFolders];

      folders.forEach(folder => {
        // If root or any ancestor is collapsed, do not render this node
        if (folder.path !== '') {
          if (STATE.collapsedFolders.has('')) {
            return;
          }
          const parts = folder.path.split('/');
          let checkAcc = '';
          let isHidden = false;
          for (let i = 0; i < parts.length - 1; i++) {
            checkAcc = checkAcc ? `${checkAcc}/${parts[i]}` : parts[i];
            if (STATE.collapsedFolders.has(checkAcc)) {
              isHidden = true;
              break;
            }
          }
          if (isHidden) return;
        }

        const hasChildren = folder.subFolderCount > 0;
        const isCollapsed = STATE.collapsedFolders.has(folder.path);
        const isSelected = !STATE.isFavoritesView && STATE.currentFolder === folder.path;
        const depth = folder.depth || 0;
        const count = STATE.includeSubfolders ? folder.totalCount : folder.directCount;

        const node = document.createElement('div');
        node.className = `tree-node ${isSelected ? 'active' : ''}`;
        node.style.paddingLeft = `${depth * 16 + 12}px`;

        // Toggle arrow
        const arrow = document.createElement('span');
        arrow.className = `tree-toggle-arrow ${hasChildren ? (isCollapsed ? '' : 'expanded') : 'empty'}`;
        arrow.innerHTML = ICONS.chevronRight;
        if (hasChildren) {
          arrow.onclick = (e) => {
            e.stopPropagation();
            if (isCollapsed) {
              STATE.collapsedFolders.delete(folder.path);
            } else {
              STATE.collapsedFolders.add(folder.path);
            }
            renderDirectoryTree();
          };
        }

        // Node content
        const iconSpan = document.createElement('span');
        iconSpan.className = 'tree-node-icon';
        iconSpan.innerHTML = isSelected ? ICONS.folderOpen : ICONS.folder;

        const textSpan = document.createElement('span');
        textSpan.className = 'tree-node-text';
        textSpan.textContent = folder.name;
        textSpan.title = folder.name;

        const countSpan = document.createElement('span');
        countSpan.className = 'tree-node-count';
        countSpan.textContent = count;

        node.appendChild(arrow);
        node.appendChild(iconSpan);
        node.appendChild(textSpan);
        node.appendChild(countSpan);

        node.onclick = () => selectFolder(folder.path);

        fragment.appendChild(node);
      });
      container.appendChild(fragment);
      updateTreeToggleAllBtn();
    }

    // Directory Tree Expand/Collapse All Subfolders Logic
    function getTargetFoldersForCurrentScope() {
      const cur = STATE.isFavoritesView ? '' : STATE.currentFolder;
      if (cur === '') {
        const rootDescendants = STATE.allFolders.filter(f => f.path !== '' && f.subFolderCount > 0);
        if (rootDescendants.length > 0) {
          return rootDescendants;
        }
        const rootFolder = STATE.allFolders.find(f => f.path === '');
        if (rootFolder && rootFolder.subFolderCount > 0) {
          return [rootFolder];
        }
        return [];
      }

      const prefix = cur + '/';
      const descendants = STATE.allFolders.filter(
        f => f.path.startsWith(prefix) && f.subFolderCount > 0
      );
      if (descendants.length > 0) {
        return descendants;
      }

      const curFolder = STATE.allFolders.find(f => f.path === cur);
      if (curFolder && curFolder.subFolderCount > 0) {
        return [curFolder];
      }
      return [];
    }

    function toggleAllSubfolders() {
      const targets = getTargetFoldersForCurrentScope();
      if (targets.length === 0) return;

      const isAnyCollapsed = targets.some(f => STATE.collapsedFolders.has(f.path));

      if (isAnyCollapsed) {
        // Expand all target subfolders
        targets.forEach(f => STATE.collapsedFolders.delete(f.path));
        // Ensure current folder and ancestors are expanded so targets are visible
        if (STATE.currentFolder !== '') {
          STATE.collapsedFolders.delete(STATE.currentFolder);
          const parts = STATE.currentFolder.split('/');
          let acc = '';
          for (let i = 0; i < parts.length - 1; i++) {
            acc = acc ? `${acc}/${parts[i]}` : parts[i];
            STATE.collapsedFolders.delete(acc);
          }
        }
        STATE.collapsedFolders.delete('');
      } else {
        // Collapse all target subfolders
        targets.forEach(f => STATE.collapsedFolders.add(f.path));
      }

      renderDirectoryTree();
    }

    function updateTreeToggleAllBtn() {
      const btn = document.getElementById('tree-toggle-all-btn');
      const iconEl = document.getElementById('tree-toggle-all-icon');
      const textEl = document.getElementById('tree-toggle-all-text');
      if (!btn) return;

      const targets = getTargetFoldersForCurrentScope();
      if (targets.length === 0) {
        btn.disabled = true;
        btn.classList.add('disabled');
        btn.title = '当前文件夹无子目录';
        btn.setAttribute('aria-label', '当前文件夹无子目录');
        if (iconEl) iconEl.innerHTML = ICONS.unfoldMore;
        if (textEl) textEl.textContent = '全部展开';
        return;
      }

      btn.disabled = false;
      btn.classList.remove('disabled');

      const isAnyCollapsed = targets.some(f => STATE.collapsedFolders.has(f.path));
      if (isAnyCollapsed) {
        btn.title = '全部展开当前子目录';
        btn.setAttribute('aria-label', '全部展开当前子目录');
        if (iconEl) iconEl.innerHTML = ICONS.unfoldMore;
        if (textEl) textEl.textContent = '全部展开';
      } else {
        btn.title = '全部折叠当前子目录';
        btn.setAttribute('aria-label', '全部折叠当前子目录');
        if (iconEl) iconEl.innerHTML = ICONS.unfoldLess;
        if (textEl) textEl.textContent = '全部折叠';
      }
    }

    function selectFolder(path) {
      STATE.isFavoritesView = false;
      STATE.currentFolder = path;

      // If path is inside collapsed folders, expand them so the selected node is visible
      if (path) {
        const parts = path.split('/');
        let acc = '';
        STATE.collapsedFolders.delete('');
        for (let i = 0; i < parts.length - 1; i++) {
          acc = acc ? `${acc}/${parts[i]}` : parts[i];
          STATE.collapsedFolders.delete(acc);
        }
        STATE.collapsedFolders.delete(path);
      } else {
        STATE.collapsedFolders.delete('');
      }

      // Update nav buttons
      document.getElementById('nav-all-btn')?.classList.toggle('active', path === '');
      document.getElementById('nav-fav-btn')?.classList.remove('active');

      runFilterPipeline();
    }

    function selectFavorites() {
      STATE.isFavoritesView = true;
      document.getElementById('nav-all-btn')?.classList.remove('active');
      document.getElementById('nav-fav-btn')?.classList.add('active');

      runFilterPipeline();
    }


    // ========================================================
    // Media Grid & Batched Incremental Rendering
    // ========================================================

    let sentinelObserver = null;

    function resetAndRenderGrid() {
      const container = document.getElementById('media-container');
      if (!container) return;

      container.querySelectorAll('video').forEach(v => {
        try {
          v.pause();
          v.src = '';
          v.load();
        } catch (e) { }
      });
      container.innerHTML = '';
      STATE.renderedCount = 0;

      if (STATE.filteredItems.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'grid-empty-state';
        empty.innerHTML = `
      <div class="grid-empty-icon">${ICONS.search}</div>
      <div style="font-size: 1rem; font-weight: 600;">未找到匹配的媒体</div>
      <div style="font-size: 0.825rem;">请尝试调整筛选条件、清除搜索关键词或切换目录</div>
    `;
        container.appendChild(empty);
        document.getElementById('sentinel-spinner').style.display = 'none';
        return;
      }

      // Render initial batch
      renderNextBatch();
      initSentinelObserver();
    }

    function renderNextBatch() {
      const container = document.getElementById('media-container');
      if (!container) return;

      const total = STATE.filteredItems.length;
      if (STATE.renderedCount >= total) {
        document.getElementById('sentinel-spinner').style.display = 'none';
        return;
      }

      const nextCount = Math.min(STATE.renderedCount + STATE.BATCH_SIZE, total);
      const itemsToRender = STATE.filteredItems.slice(STATE.renderedCount, nextCount);

      const fragment = document.createDocumentFragment();

      itemsToRender.forEach((item, batchIdx) => {
        const globalIdx = STATE.renderedCount + batchIdx;
        const card = createMediaCard(item, globalIdx);
        fragment.appendChild(card);
      });

      container.appendChild(fragment);
      STATE.renderedCount = nextCount;

      if (STATE.renderedCount >= total) {
        document.getElementById('sentinel-spinner').style.display = 'none';
      } else {
        document.getElementById('sentinel-spinner').style.display = 'block';
      }
    }

    function createMediaCard(item, index) {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.dataset.index = index;
      card.dataset.id = item.id;

      // Zero-CLS aspect ratio preset
      const w = item.width || 4;
      const h = item.height || 3;
      card.style.aspectRatio = `${w} / ${h}`;

      const isFav = STATE.favoritesSet.has(item.src);
      const isGif = item.ext === 'gif' || item.ext === '.gif' || (item.name && item.name.toLowerCase().endsWith('.gif'));
      const isVideo = item.type === 'video';
      const is4K = (item.width >= 3840 || item.height >= 2160);

      // Top-left badges
      let badgeHtml = '';
      if (isGif) {
        badgeHtml += `<span class="badge-tag badge-gif">GIF</span>`;
      } else if (isVideo) {
        badgeHtml += `<span class="badge-tag badge-video">VIDEO</span>`;
      } else if (is4K) {
        badgeHtml += `<span class="badge-tag badge-4k">4K</span>`;
      }

      // Video duration badge
      let durationHtml = '';
      if (isVideo && item.duration > 0) {
        durationHtml = `<div class="card-duration-badge">${formatDuration(item.duration)}</div>`;
      }

      // Tags for hover overlay (first 3)
      const topTags = (item.tags || []).slice(0, 3);
      const tagsHtml = topTags.map(t => `<span class="overlay-tag">${t}</span>`).join('');

      // Media element
      let mediaHtml = '';
      if (isVideo) {
        mediaHtml = `
      <video
        src="${item.src}#t=0.5"
        preload="metadata"
        muted
        playsinline
        loop
      ></video>
    `;
      } else {
        mediaHtml = `
      <img
        src="${item.src}"
        alt="${item.name}"
        loading="lazy"
        decoding="async"
      />
    `;
      }

      card.innerHTML = `
    <div class="media-thumbnail-wrapper">
      ${mediaHtml}
      ${badgeHtml ? `<div class="card-badge-top-left">${badgeHtml}</div>` : ''}
      <button
        class="card-fav-btn ${isFav ? 'active' : ''}"
        data-src="${item.src}"
        title="${isFav ? '取消收藏' : '添加收藏'}"
      >
        ${isFav ? ICONS.heartFilled : ICONS.heartOutline}
      </button>
      ${durationHtml}
      <div class="card-hover-overlay">
        <div class="overlay-filename" title="${item.name}">${item.name}</div>
        <div class="overlay-meta">
          <span>${item.width ? `${item.width} × ${item.height}` : (isVideo ? '视频媒体' : '图片')}</span>
          <span>${formatBytes(item.size)}</span>
        </div>
        ${tagsHtml ? `<div class="overlay-tags">${tagsHtml}</div>` : ''}
      </div>
    </div>
  `;

      // Favorite button click handler
      const favBtn = card.querySelector('.card-fav-btn');
      favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(item.src);
      });

      // Video hover 300ms preview
      if (isVideo) {
        const videoEl = card.querySelector('video');
        let hoverTimer = null;
        card.addEventListener('mouseenter', () => {
          hoverTimer = setTimeout(() => {
            if (videoEl) {
              videoEl.play().catch(() => { });
            }
          }, 300);
        });
        card.addEventListener('mouseleave', () => {
          if (hoverTimer) {
            clearTimeout(hoverTimer);
            hoverTimer = null;
          }
          if (videoEl) {
            videoEl.pause();
            if (videoEl.readyState >= 1) {
              try { videoEl.currentTime = 0.5; } catch (e) { }
            }
          }
        });
      }

      // Card click: open Lightbox
      card.addEventListener('click', () => {
        openLightbox(index);
      });

      return card;
    }

    // Sentinel IntersectionObserver for batch rendering
    function initSentinelObserver() {
      if (sentinelObserver) {
        sentinelObserver.disconnect();
      }

      const sentinel = document.getElementById('scroll-sentinel');
      if (!sentinel) return;

      sentinelObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          if (STATE.renderedCount < STATE.filteredItems.length) {
            renderNextBatch();
          }
        }
      }, {
        rootMargin: '400px 0px',
        threshold: 0.01
      });

      sentinelObserver.observe(sentinel);
    }

    // Back to Top button visibility updater
    function updateBackToTopVisibility() {
      const btn = document.getElementById('back-to-top-btn');
      if (!btn) return;
      const scrollTop = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
      if (scrollTop > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }

    // Layout Mode and Slider
    function setLayoutMode(mode) {
      STATE.layoutMode = mode;
      const container = document.getElementById('media-container');
      if (!container) return;

      container.classList.remove('mode-masonry', 'mode-grid', 'mode-square');
      container.classList.add(`mode-${mode}`);

      document.getElementById('view-mode-masonry')?.classList.toggle('active', mode === 'masonry');
      document.getElementById('view-mode-grid')?.classList.toggle('active', mode === 'grid');
      document.getElementById('view-mode-square')?.classList.toggle('active', mode === 'square');
    }

    function setCardWidth(width) {
      STATE.cardMinWidth = width;
      document.documentElement.style.setProperty('--card-min-width', `${width}px`);
    }


    // ========================================================
    // Professional Lightbox Modal
    // ========================================================

    function openLightbox(index) {
      if (!STATE.filteredItems || STATE.filteredItems.length === 0) return;
      if (index < 0) index = 0;
      if (index >= STATE.filteredItems.length) index = STATE.filteredItems.length - 1;

      STATE.lightbox.isOpen = true;
      STATE.lightbox.currentIndex = index;
      resetLightboxTransform();

      const modal = document.getElementById('lightbox-modal');
      modal.classList.add('active');
      modal.focus();

      renderLightboxCurrentItem();
    }

    function closeLightbox() {
      STATE.lightbox.isOpen = false;
      STATE.lightbox.isDragging = false;
      document.getElementById('lightbox-viewport')?.classList.remove('panning');

      const modal = document.getElementById('lightbox-modal');
      modal.classList.remove('active');

      const wrapper = document.getElementById('lightbox-media-wrapper');
      if (wrapper) {
        const v = wrapper.querySelector('video');
        if (v) {
          v.pause();
          v.src = '';
        }
        wrapper.innerHTML = '';
      }
    }

    function resetLightboxTransform() {
      STATE.lightbox.zoomScale = 1;
      STATE.lightbox.translateX = 0;
      STATE.lightbox.translateY = 0;
      STATE.lightbox.rotation = 0;
      applyLightboxTransform();
    }

    function applyLightboxTransform() {
      const wrapper = document.getElementById('lightbox-media-wrapper');
      if (!wrapper) return;
      const { zoomScale, translateX, translateY, rotation } = STATE.lightbox;
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomScale}) rotate(${rotation}deg)`;
    }

    function renderLightboxCurrentItem() {
      const item = STATE.filteredItems[STATE.lightbox.currentIndex];
      if (!item) return;

      const total = STATE.filteredItems.length;
      const currentIdx = STATE.lightbox.currentIndex;

      // Header info
      document.getElementById('lightbox-counter').textContent = `${currentIdx + 1} / ${total}`;
      document.getElementById('lightbox-title').textContent = item.name;

      // Favorite button
      const isFav = STATE.favoritesSet.has(item.src);
      const favBtn = document.getElementById('lightbox-fav-btn');
      favBtn.classList.toggle('active', isFav);
      favBtn.classList.toggle('lightbox-btn-danger', isFav);
      favBtn.innerHTML = (isFav ? ICONS.heartFilled : ICONS.heartOutline) + ` <span>${isFav ? '已收藏' : '收藏'}</span>`;

      // Media render
      const wrapper = document.getElementById('lightbox-media-wrapper');
      if (wrapper) {
        const v = wrapper.querySelector('video');
        if (v) {
          v.pause();
          v.src = '';
        }
        wrapper.innerHTML = '';
      }

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        wrapper.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.name;
        img.draggable = false;
        wrapper.appendChild(img);
      }

      // Preload next and prev images
      preloadAdjacentImages();

      // Update Drawer info
      updateLightboxDrawer(item);
    }

    function preloadAdjacentImages() {
      const total = STATE.filteredItems.length;
      if (total <= 1) return;
      const currentIdx = STATE.lightbox.currentIndex;

      const nextIdx = (currentIdx + 1) % total;
      const prevIdx = (currentIdx - 1 + total) % total;
      const indices = nextIdx === prevIdx ? [nextIdx] : [nextIdx, prevIdx];

      indices.forEach(idx => {
        const it = STATE.filteredItems[idx];
        if (it && it.type === 'image') {
          const preloadImg = new Image();
          preloadImg.src = it.src;
        }
      });
    }

    function updateLightboxDrawer(item) {
      document.getElementById('drawer-filename').textContent = item.name;

      const folderEl = document.getElementById('drawer-folder');
      folderEl.textContent = item.folder || '根目录';
      folderEl.className = 'drawer-value drawer-folder-link';
      folderEl.onclick = () => {
        closeLightbox();
        selectFolder(item.folder || '');
      };

      const dimEl = document.getElementById('drawer-dimensions');
      if (item.width && item.height) {
        dimEl.textContent = `${item.width} × ${item.height} 像素`;
      } else if (item.type === 'video') {
        dimEl.textContent = `视频时长: ${formatDuration(item.duration)}`;
      } else {
        dimEl.textContent = '-';
      }

      document.getElementById('drawer-size').textContent = formatBytes(item.size);
      document.getElementById('drawer-date').textContent = formatDate(item.mtime);

      // Tags
      const tagsContainer = document.getElementById('drawer-tags');
      tagsContainer.innerHTML = '';
      if (item.tags && item.tags.length > 0) {
        item.tags.forEach(tag => {
          const pill = document.createElement('span');
          pill.className = 'drawer-tag-pill';
          pill.textContent = tag;
          pill.onclick = () => {
            closeLightbox();
            STATE.selectedTags.clear();
            STATE.selectedTags.add(tag);
            runFilterPipeline();
            showToast(`已按标签 "${tag}" 过滤`, 'info');
          };
          tagsContainer.appendChild(pill);
        });
      } else {
        tagsContainer.innerHTML = '<span style="font-size:0.8rem;color:var(--text-muted);">暂无标签</span>';
      }
    }

    function lightboxPrev() {
      if (!STATE.lightbox.isOpen) return;
      if (STATE.filteredItems.length <= 1) return;
      STATE.lightbox.currentIndex = (STATE.lightbox.currentIndex - 1 + STATE.filteredItems.length) % STATE.filteredItems.length;
      resetLightboxTransform();
      renderLightboxCurrentItem();
    }

    function lightboxNext() {
      if (!STATE.lightbox.isOpen) return;
      if (STATE.filteredItems.length <= 1) return;
      STATE.lightbox.currentIndex = (STATE.lightbox.currentIndex + 1) % STATE.filteredItems.length;
      resetLightboxTransform();
      renderLightboxCurrentItem();
    }

    function toggleLightboxDrawer() {
      const drawer = document.getElementById('lightbox-drawer');
      const infoBtn = document.getElementById('lightbox-info-btn');
      STATE.lightbox.isDrawerOpen = !STATE.lightbox.isDrawerOpen;
      drawer.classList.toggle('collapsed', !STATE.lightbox.isDrawerOpen);
      infoBtn.classList.toggle('active', STATE.lightbox.isDrawerOpen);
    }

    function rotateLightbox() {
      const item = STATE.filteredItems[STATE.lightbox.currentIndex];
      if (!item || item.type !== 'image') return;
      STATE.lightbox.rotation = (STATE.lightbox.rotation + 90) % 360;
      applyLightboxTransform();
    }

    function zoomLightbox(factor) {
      const item = STATE.filteredItems[STATE.lightbox.currentIndex];
      if (!item || item.type !== 'image') return;
      let newScale = STATE.lightbox.zoomScale * factor;
      if (newScale < 0.5) newScale = 0.5;
      if (newScale > 6.0) newScale = 6.0;
      STATE.lightbox.zoomScale = newScale;
      applyLightboxTransform();
    }

    // Lightbox Mouse Interactions (Wheel Zoom, Drag Pan, Double Click 1:1)
    function initLightboxCanvasEvents() {
      const viewport = document.getElementById('lightbox-viewport');
      if (!viewport) return;

      // Wheel zoom
      viewport.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest('.lightbox-nav-arrow')) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.87;
        zoomLightbox(factor);
      }, { passive: false });

      // Pan / Drag
      viewport.addEventListener('mousedown', (e) => {
        // Left mouse button only, and image items only
        if (e.button !== 0) return;
        if (e.target && e.target.closest('.lightbox-nav-arrow')) return;
        const item = STATE.filteredItems[STATE.lightbox.currentIndex];
        if (!item || item.type !== 'image') return;
        if (e.target && e.target.tagName === 'VIDEO') return;
        STATE.lightbox.isDragging = true;
        STATE.lightbox.startX = e.clientX - STATE.lightbox.translateX;
        STATE.lightbox.startY = e.clientY - STATE.lightbox.translateY;
        viewport.classList.add('panning');
      });

      window.addEventListener('mousemove', (e) => {
        if (!STATE.lightbox.isDragging || !STATE.lightbox.isOpen) return;
        STATE.lightbox.translateX = e.clientX - STATE.lightbox.startX;
        STATE.lightbox.translateY = e.clientY - STATE.lightbox.startY;
        applyLightboxTransform();
      });

      window.addEventListener('mouseup', () => {
        if (STATE.lightbox.isDragging) {
          STATE.lightbox.isDragging = false;
          viewport.classList.remove('panning');
        }
      });

      // Double Click: Toggle between Fit (1x) and 1:1 Original Pixel
      viewport.addEventListener('dblclick', (e) => {
        if (e.target && e.target.closest('.lightbox-nav-arrow')) return;
        const item = STATE.filteredItems[STATE.lightbox.currentIndex];
        if (!item || item.type !== 'image') return;

        if (STATE.lightbox.zoomScale > 1.05) {
          // Reset to Fit
          resetLightboxTransform();
        } else {
          // Zoom to 1:1 natural pixel
          const img = document.querySelector('#lightbox-media-wrapper img');
          STATE.lightbox.translateX = 0;
          STATE.lightbox.translateY = 0;
          if (img && img.naturalWidth && img.clientWidth) {
            const naturalScale = img.naturalWidth / img.clientWidth;
            STATE.lightbox.zoomScale = Math.min(Math.max(naturalScale, 1.5), 6.0);
          } else {
            STATE.lightbox.zoomScale = 2.0;
          }
          applyLightboxTransform();
        }
      });
    }


    // ========================================================
    // Immersive Fullscreen Slideshow
    // ========================================================

    function startSlideshow(startIndex = 0) {
      if (!STATE.filteredItems || STATE.filteredItems.length === 0) {
        showToast('当前筛选列表中没有可放映的媒体', 'warning');
        return;
      }

      // If lightbox is open, close it
      if (STATE.lightbox.isOpen) {
        closeLightbox();
      }

      STATE.slideshow.isOpen = true;
      STATE.slideshow.currentIndex = startIndex >= 0 && startIndex < STATE.filteredItems.length ? startIndex : 0;
      STATE.slideshow.isPlaying = true;

      const modal = document.getElementById('slideshow-modal');
      modal.classList.add('active');

      // Request native fullscreen
      try {
        if (modal.requestFullscreen) {
          modal.requestFullscreen().catch(() => { });
        } else if (modal.webkitRequestFullscreen) {
          modal.webkitRequestFullscreen().catch(() => { });
        }
      } catch (e) { }

      updateSlideshowHudControls();
      renderSlideshowItem();

      // Reset mouse timer for auto-hiding HUD
      if (STATE.slideshow.mouseTimer) {
        clearTimeout(STATE.slideshow.mouseTimer);
      }
      STATE.slideshow.mouseTimer = setTimeout(() => {
        if (STATE.slideshow.isOpen) {
          modal.classList.add('hud-hidden');
        }
      }, 2500);
    }

    function stopSlideshow() {
      STATE.slideshow.isOpen = false;
      STATE.slideshow.isPlaying = false;
      clearSlideshowTimers();

      if (STATE.slideshow.mouseTimer) {
        clearTimeout(STATE.slideshow.mouseTimer);
        STATE.slideshow.mouseTimer = null;
      }

      const modal = document.getElementById('slideshow-modal');
      modal.classList.remove('active', 'hud-hidden');

      // Exit fullscreen if active
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => { });
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen().catch(() => { });
          }
        }
      } catch (e) { }

      const stage = document.getElementById('slideshow-stage');
      if (stage) {
        stage.querySelectorAll('video').forEach(v => {
          v.pause();
          v.src = '';
        });
        stage.innerHTML = '';
      }
    }

    function clearSlideshowTimers() {
      if (STATE.slideshow.timer) {
        clearTimeout(STATE.slideshow.timer);
        STATE.slideshow.timer = null;
      }
      if (STATE.slideshow.progressInterval) {
        clearInterval(STATE.slideshow.progressInterval);
        STATE.slideshow.progressInterval = null;
      }
      const fill = document.getElementById('slideshow-progress-bar-fill');
      if (fill) fill.style.width = '0%';
    }

    function renderSlideshowItem() {
      if (!STATE.slideshow.isOpen) return;
      clearSlideshowTimers();

      const total = STATE.filteredItems.length;
      const currentIdx = STATE.slideshow.currentIndex;
      const item = STATE.filteredItems[currentIdx];
      if (!item) return;

      const stage = document.getElementById('slideshow-stage');
      const counter = document.getElementById('hud-counter');
      counter.textContent = `${currentIdx + 1} / ${total}`;

      // Update HUD favorite button
      const isFav = STATE.favoritesSet.has(item.src);
      const hudFav = document.getElementById('hud-fav-btn');
      hudFav.classList.toggle('active', isFav);
      hudFav.classList.toggle('hud-btn-danger', isFav);
      hudFav.innerHTML = isFav ? ICONS.heartFilled : ICONS.heartOutline;

      // Create new media container
      const newContainer = document.createElement('div');
      newContainer.className = 'slideshow-media-container';

      const isVideo = item.type === 'video';

      if (isVideo) {
        const video = document.createElement('video');
        video.src = item.src;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        newContainer.appendChild(video);

        stage.appendChild(newContainer);
        // Trigger transition
        requestAnimationFrame(() => {
          newContainer.classList.add('current');
          cleanupOldSlideshowContainers(stage, newContainer);
        });

        // Intelligent video waiting: pause timer, track video progress, advance when finished
        const progressBar = document.getElementById('slideshow-progress-bar-fill');
        video.addEventListener('timeupdate', () => {
          if (video.duration > 0 && progressBar) {
            const pct = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${pct}%`;
          }
        });

        const advanceAfterVideo = () => {
          if (newContainer.classList.contains('current') && STATE.slideshow.isOpen && STATE.slideshow.isPlaying) {
            slideshowNext();
          }
        };

        const handleVideoError = () => {
          if (newContainer.classList.contains('current') && STATE.slideshow.isOpen && STATE.slideshow.isPlaying) {
            showToast(`视频加载失败: ${item.name}`, 'warning');
            setTimeout(() => {
              if (newContainer.classList.contains('current') && STATE.slideshow.isOpen && STATE.slideshow.isPlaying) {
                slideshowNext();
              }
            }, 1500);
          }
        };

        video.addEventListener('ended', advanceAfterVideo, { once: true });
        video.addEventListener('error', handleVideoError, { once: true });

        video.play().catch(() => {
          // Browser autoplay policy blocked unmuted video; try muted autoplay
          video.muted = true;
          video.play().catch(() => {
            // Still cannot play (e.g. format unsupported); fallback to countdown timer so slideshow advances
            if (STATE.slideshow.isOpen && STATE.slideshow.isPlaying && newContainer.classList.contains('current')) {
              startImageCountdown();
            }
          });
        });
      } else {
        // Image item
        const img = document.createElement('img');
        img.src = item.src;
        img.className = 'kenburns';
        newContainer.appendChild(img);

        stage.appendChild(newContainer);
        requestAnimationFrame(() => {
          newContainer.classList.add('current');
          cleanupOldSlideshowContainers(stage, newContainer);
        });

        // Start timer & countdown streamer if playing
        if (STATE.slideshow.isPlaying) {
          startImageCountdown();
        }
      }
    }

    function cleanupOldSlideshowContainers(stage, currentContainer) {
      const containers = stage.querySelectorAll('.slideshow-media-container');
      containers.forEach(c => {
        if (c !== currentContainer) {
          c.classList.remove('current');
          const v = c.querySelector('video');
          if (v) {
            v.pause();
            v.src = '';
          }
          setTimeout(() => {
            if (c.parentNode === stage) stage.removeChild(c);
          }, 900);
        }
      });
    }

    function startImageCountdown() {
      if (!STATE.slideshow.isOpen || !STATE.slideshow.isPlaying) return;
      clearSlideshowTimers();

      const progressBar = document.getElementById('slideshow-progress-bar-fill');
      const duration = STATE.slideshow.intervalMs;
      STATE.slideshow.progressStartTime = performance.now();

      STATE.slideshow.progressInterval = setInterval(() => {
        const elapsed = performance.now() - STATE.slideshow.progressStartTime;
        const pct = Math.min((elapsed / duration) * 100, 100);
        if (progressBar) progressBar.style.width = `${pct}%`;
      }, 50);

      STATE.slideshow.timer = setTimeout(() => {
        slideshowNext();
      }, duration);
    }

    function slideshowNext() {
      if (!STATE.slideshow.isOpen) return;
      const total = STATE.filteredItems.length;
      if (total <= 0) return;
      if (total === 1) {
        renderSlideshowItem();
        return;
      }

      if (STATE.slideshow.isShuffle) {
        let nextIdx = Math.floor(Math.random() * total);
        if (nextIdx === STATE.slideshow.currentIndex) {
          nextIdx = (nextIdx + 1) % total;
        }
        STATE.slideshow.currentIndex = nextIdx;
      } else {
        STATE.slideshow.currentIndex = (STATE.slideshow.currentIndex + 1) % total;
      }

      renderSlideshowItem();
    }

    function slideshowPrev() {
      if (!STATE.slideshow.isOpen) return;
      const total = STATE.filteredItems.length;
      if (total <= 0) return;
      if (total === 1) {
        renderSlideshowItem();
        return;
      }

      if (STATE.slideshow.isShuffle) {
        STATE.slideshow.currentIndex = Math.floor(Math.random() * total);
      } else {
        STATE.slideshow.currentIndex = (STATE.slideshow.currentIndex - 1 + total) % total;
      }

      renderSlideshowItem();
    }

    function toggleSlideshowPlay() {
      STATE.slideshow.isPlaying = !STATE.slideshow.isPlaying;
      updateSlideshowHudControls();

      const currentItem = STATE.filteredItems[STATE.slideshow.currentIndex];
      if (!currentItem) return;

      if (currentItem.type === 'video') {
        const video = document.querySelector('#slideshow-stage video');
        if (video) {
          if (STATE.slideshow.isPlaying) video.play().catch(() => { });
          else video.pause();
        }
      } else {
        if (STATE.slideshow.isPlaying) {
          startImageCountdown();
        } else {
          clearSlideshowTimers();
        }
      }
    }

    function toggleSlideshowMode() {
      STATE.slideshow.isShuffle = !STATE.slideshow.isShuffle;
      updateSlideshowHudControls();
      showToast(STATE.slideshow.isShuffle ? '已切换至随机播放' : '已切换至顺序循环', 'info');
    }

    function updateSlideshowHudControls() {
      const playBtn = document.getElementById('hud-play-btn');
      if (playBtn) {
        playBtn.innerHTML = STATE.slideshow.isPlaying ? ICONS.pause : ICONS.play;
        playBtn.title = STATE.slideshow.isPlaying ? '暂停 (空格 Space)' : '播放 (空格 Space)';
      }

      const modeBtn = document.getElementById('hud-mode-btn');
      if (modeBtn) {
        modeBtn.innerHTML = STATE.slideshow.isShuffle ? ICONS.shuffle : ICONS.loop;
        modeBtn.title = STATE.slideshow.isShuffle ? '当前模式: 随机播放' : '当前模式: 顺序循环';
      }

      const subBtn = document.getElementById('hud-subfolder-btn');
      if (subBtn) {
        subBtn.innerHTML = ICONS.subfolder;
        subBtn.classList.toggle('active', STATE.includeSubfolders);
        subBtn.title = STATE.includeSubfolders ? '包含子目录: 开启' : '包含子目录: 关闭';
      }
    }

    // Auto-hide HUD after 2.5s of mouse inactivity
    function initSlideshowMouseActivity() {
      const modal = document.getElementById('slideshow-modal');
      const hud = document.getElementById('slideshow-hud');

      const onMouseMove = () => {
        if (!STATE.slideshow.isOpen) return;
        modal.classList.remove('hud-hidden');

        if (STATE.slideshow.mouseTimer) {
          clearTimeout(STATE.slideshow.mouseTimer);
        }
        STATE.slideshow.mouseTimer = setTimeout(() => {
          if (STATE.slideshow.isOpen) {
            if (hud && hud.matches(':hover')) {
              return;
            }
            modal.classList.add('hud-hidden');
          }
        }, 2500);
      };

      modal.addEventListener('mousemove', onMouseMove);
    }


    // ========================================================
    // App Bootstrap & Event Binding
    // ========================================================

    function initApp() {
      // Initialize theme first so both onboarding and main UI respect theme preference
      applyTheme(STATE.theme);

      // Check uninitialized or empty state
      const data = window.PHOTO_WALL_DATA;
      if (!data || !data.items || !Array.isArray(data.items) || data.items.length === 0) {
        showOnboardingScreen();
        return;
      }

      // Hide onboarding, show app
      document.getElementById('onboarding-overlay').style.display = 'none';
      document.getElementById('app-root').style.display = 'flex';

      // Populate data
      STATE.allFolders = data.folders || [];
      STATE.allItems = data.items || [];

      // Default all collapsed: all folders with children (except root '') are collapsed
      STATE.collapsedFolders = new Set(
        STATE.allFolders
          .filter(f => f.path !== '' && f.subFolderCount > 0)
          .map(f => f.path)
      );

      // Dynamic Title
      const meta = data.meta || {};
      const pageTitle = meta.title || 'PhotoWall';
      document.title = pageTitle;
      const brandTitleEl = document.getElementById('brand-title');
      if (brandTitleEl) brandTitleEl.textContent = pageTitle;

      // Sidebar Footer Info
      document.getElementById('stat-total-size').textContent = formatBytes(meta.totalSize || 0);
      document.getElementById('stat-media-count').textContent = `${meta.imageCount || 0} 图 · ${meta.videoCount || 0} 视`;
      document.getElementById('stat-generated-at').textContent = formatDate(meta.generatedAt);

      // Initialize Icons & UI elements
      injectStaticIcons();

      // Initialize favorites
      initFavorites();

      // Subfolder switch state
      const subfolderCb = document.getElementById('subfolder-checkbox');
      if (subfolderCb) {
        subfolderCb.checked = STATE.includeSubfolders;
      }

      // Bind all event listeners
      bindEvents();

      // Run initial filter pipeline
      runFilterPipeline();
    }

    function bindEvents() {

        const sidebar = document.getElementById('sidebar');
        STATE.isSidebarCollapsed = !STATE.isSidebarCollapsed;
        sidebar.classList.toggle('collapsed', STATE.isSidebarCollapsed);
      });

      // Brand click -> reset to root
      document.getElementById('brand-link').addEventListener('click', () => {
        selectFolder('');
      });

      // Search input & clear with debouncing
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear-btn');
      let searchDebounceTimer = null;

      searchInput.addEventListener('input', (e) => {
        const val = e.target.value;
        STATE.searchKeyword = val;
        clearBtn.style.display = val ? 'flex' : 'none';
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          runFilterPipeline();
        }, 200);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (searchDebounceTimer) {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = null;
          }
          runFilterPipeline();
        }
      });

      clearBtn.addEventListener('click', () => {
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = null;
        }
        searchInput.value = '';
        STATE.searchKeyword = '';
        clearBtn.style.display = 'none';
        searchInput.focus();
        runFilterPipeline();
      });

      // Subfolder switch checkbox
      document.getElementById('subfolder-checkbox').addEventListener('change', (e) => {
        STATE.includeSubfolders = e.target.checked;
        localStorage.setItem('PHOTOWALL_INCLUDE_SUBFOLDERS', String(STATE.includeSubfolders));
        runFilterPipeline();
      });

      // Topbar Slideshow button
      document.getElementById('topbar-slideshow-btn').addEventListener('click', () => {
        startSlideshow(0);
      });

      // Layout View mode buttons
      document.getElementById('view-mode-masonry').addEventListener('click', () => setLayoutMode('masonry'));
      document.getElementById('view-mode-grid').addEventListener('click', () => setLayoutMode('grid'));
      document.getElementById('view-mode-square').addEventListener('click', () => setLayoutMode('square'));

      // Card width slider
      const slider = document.getElementById('card-width-slider');
      slider.addEventListener('input', (e) => {
        setCardWidth(e.target.value);
      });

      // Theme toggle
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

      // Sidebar Nav Shortcuts
      document.getElementById('nav-all-btn').addEventListener('click', () => selectFolder(''));
      document.getElementById('nav-fav-btn').addEventListener('click', selectFavorites);

      // Directory Tree Toggle All Subfolders
      const treeToggleBtn = document.getElementById('tree-toggle-all-btn');
      if (treeToggleBtn) {
        treeToggleBtn.addEventListener('click', toggleAllSubfolders);
      }

      // Media type filter buttons
      document.querySelectorAll('.type-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          STATE.mediaType = btn.dataset.type;
          runFilterPipeline();
        });
      });

      // Sort dropdown
      document.getElementById('sort-select').addEventListener('change', (e) => {
        STATE.sortBy = e.target.value;
        runFilterPipeline();
      });

      // Lightbox Header & Nav buttons
      document.getElementById('lightbox-close-btn').addEventListener('click', closeLightbox);
      document.getElementById('lightbox-prev-btn').addEventListener('click', lightboxPrev);
      document.getElementById('lightbox-next-btn').addEventListener('click', lightboxNext);
      document.getElementById('lightbox-zoom-in-btn').addEventListener('click', () => zoomLightbox(1.25));
      document.getElementById('lightbox-zoom-out-btn').addEventListener('click', () => zoomLightbox(0.8));
      document.getElementById('lightbox-zoom-reset-btn').addEventListener('click', resetLightboxTransform);
      document.getElementById('lightbox-rotate-btn').addEventListener('click', rotateLightbox);
      document.getElementById('lightbox-info-btn').addEventListener('click', toggleLightboxDrawer);
      document.getElementById('drawer-close-btn').addEventListener('click', toggleLightboxDrawer);

      document.getElementById('lightbox-fav-btn').addEventListener('click', () => {
        const item = STATE.filteredItems[STATE.lightbox.currentIndex];
        if (item) toggleFavorite(item.src);
      });

      document.getElementById('lightbox-play-btn').addEventListener('click', () => {
        startSlideshow(STATE.lightbox.currentIndex);
      });

      // Initialize Lightbox canvas drag / wheel / dblclick
      initLightboxCanvasEvents();

      // Slideshow HUD Controls
      document.getElementById('hud-prev-btn').addEventListener('click', slideshowPrev);
      document.getElementById('hud-next-btn').addEventListener('click', slideshowNext);
      document.getElementById('hud-play-btn').addEventListener('click', toggleSlideshowPlay);
      document.getElementById('hud-mode-btn').addEventListener('click', toggleSlideshowMode);
      document.getElementById('hud-exit-btn').addEventListener('click', stopSlideshow);

      document.getElementById('hud-interval-select').addEventListener('change', (e) => {
        STATE.slideshow.intervalMs = parseInt(e.target.value, 10) || 5000;
        const currentItem = STATE.filteredItems[STATE.slideshow.currentIndex];
        if (STATE.slideshow.isPlaying && currentItem && currentItem.type !== 'video') {
          startImageCountdown();
        }
      });

      document.getElementById('hud-fav-btn').addEventListener('click', () => {
        const item = STATE.filteredItems[STATE.slideshow.currentIndex];
        if (item) toggleFavorite(item.src);
      });

      const hudSubfolderBtn = document.getElementById('hud-subfolder-btn');
      if (hudSubfolderBtn) {
        hudSubfolderBtn.addEventListener('click', () => {
          STATE.includeSubfolders = !STATE.includeSubfolders;
          localStorage.setItem('PHOTOWALL_INCLUDE_SUBFOLDERS', String(STATE.includeSubfolders));
          const subCb = document.getElementById('subfolder-checkbox');
          if (subCb) subCb.checked = STATE.includeSubfolders;
          hudSubfolderBtn.classList.toggle('active', STATE.includeSubfolders);
          hudSubfolderBtn.title = STATE.includeSubfolders ? '包含子目录: 开启' : '包含子目录: 关闭';
          runFilterPipeline();
          if (STATE.filteredItems.length === 0) {
            stopSlideshow();
            showToast('当前目录下无媒体，已退出放映', 'info');
            return;
          }
          if (STATE.slideshow.currentIndex >= STATE.filteredItems.length) {
            STATE.slideshow.currentIndex = Math.max(0, STATE.filteredItems.length - 1);
          }
          renderSlideshowItem();
          showToast(STATE.includeSubfolders ? '幻灯片：已开启包含子目录' : '幻灯片：已关闭包含子目录', 'info');
        });
      }

      // Initialize slideshow mouse activity tracking once
      initSlideshowMouseActivity();

      // Fullscreen exit change listener
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && STATE.slideshow.isOpen) {
          stopSlideshow();
        }
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (!document.webkitFullscreenElement && STATE.slideshow.isOpen) {
          stopSlideshow();
        }
      });

      // Back to top button click
      const backToTopBtn = document.getElementById('back-to-top-btn');
      if (backToTopBtn) {
        backToTopBtn.addEventListener('click', () => {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });
      }

      // Back to top scroll listener (throttled with requestAnimationFrame)
      let scrollTicking = false;
      window.addEventListener('scroll', () => {
        if (!scrollTicking) {
          window.requestAnimationFrame(() => {
            updateBackToTopVisibility();
            scrollTicking = false;
          });
          scrollTicking = true;
        }
      }, { passive: true });

      // Global Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // If typing in input, select or textarea, ignore global shortcuts except Escape
        if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          if (e.key === 'Escape') {
            document.activeElement.blur();
          }
          return;
        }

        // 1. Slideshow mode shortcuts
        if (STATE.slideshow.isOpen) {
          if (e.key === 'Escape') {
            stopSlideshow();
            e.preventDefault();
          } else if (e.key === ' ' || e.code === 'Space') {
            toggleSlideshowPlay();
            e.preventDefault();
          } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            slideshowPrev();
            e.preventDefault();
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            slideshowNext();
            e.preventDefault();
          } else if (e.key === 'f' || e.key === 'F') {
            const item = STATE.filteredItems[STATE.slideshow.currentIndex];
            if (item) toggleFavorite(item.src);
            e.preventDefault();
          }
          return;
        }

        // 2. Lightbox mode shortcuts
        if (STATE.lightbox.isOpen) {
          if (e.key === 'Escape') {
            closeLightbox();
            e.preventDefault();
          } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            lightboxPrev();
            e.preventDefault();
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            lightboxNext();
            e.preventDefault();
          } else if (e.key === 'f' || e.key === 'F') {
            const item = STATE.filteredItems[STATE.lightbox.currentIndex];
            if (item) toggleFavorite(item.src);
            e.preventDefault();
          } else if (e.key === 'i' || e.key === 'I') {
            toggleLightboxDrawer();
            e.preventDefault();
          } else if (e.key === '0') {
            resetLightboxTransform();
            e.preventDefault();
          } else if (e.key === 'r' || e.key === 'R') {
            rotateLightbox();
            e.preventDefault();
          } else if (e.key === '+' || e.key === '=') {
            zoomLightbox(1.25);
            e.preventDefault();
          } else if (e.key === '-' || e.key === '_') {
            zoomLightbox(0.8);
            e.preventDefault();
          }
          return;
        }

        // 3. Main View shortcuts
        if (e.key === '/') {
          e.preventDefault();
          document.getElementById('search-input')?.focus();
        }
      });
    }

    // Kick off when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

  </script>
</body>

</html>
