[project]
name = "PhotoWall"
dynamic = ["version"]
description = "一款基于预生成元数据的轻量级照片墙"
readme = "README.md"
authors = [{ name = "Martin", email = "qule520@126.com" }]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "onnxruntime-directml>=1.24.4",
    "onnxruntime-gpu>=1.31.0",
    "pillow>=13.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
photowall = "photowall.cli:main"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://github.com/ecator/PhotoWall"
Repository = "https://github.com/ecator/PhotoWall"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception: `Exception`
    "S110",   # `try`-`except`-`pass` detected
    "S112",   # `try`-`except`-`continue` detected
]
